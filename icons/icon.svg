<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="107" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4" />

  <!-- Shield Base (The World of Trust) -->
  <g transform="translate(256, 256) scale(0.9) translate(-256, -256)">
    <!-- Shield Shadow -->
    <path d="M256 60 L400 115 C400 275 256 395 256 425 C256 395 112 275 112 115 Z" fill="rgba(0,0,0,0.35)" transform="translate(0, 10)" />

    <!-- Main Shield -->
    <path d="M256 60 L400 115 C400 275 256 395 256 425 C256 395 112 275 112 115 Z" fill="url(#shieldGrad)" filter="url(#glow)" />

    <!-- Inner Shield Contrast -->
    <path d="M256 95 L372 138 C372 265 256 360 256 385 C256 360 140 265 140 138 Z" fill="#0f172a" opacity="0.88" />

    <!-- Checkmark & Chart Graph combination inside shield -->
    <!-- Growth Trendline / Lightning -->
    <path d="M185 270 L230 220 L275 250 L335 170" fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Glowing points on the graph -->
    <circle cx="185" cy="270" r="10" fill="#4ade80" />
    <circle cx="230" cy="220" r="10" fill="#4ade80" />
    <circle cx="275" cy="250" r="10" fill="#4ade80" />
    <circle cx="335" cy="170" r="14" fill="#38bdf8" />
  </g>

  <!-- Small star sparkle -->
  <path d="M380 90 Q395 90 395 75 Q395 90 410 90 Q395 90 395 105 Q395 90 380 90 Z" fill="#ffffff" opacity="0.9" />
</svg>
